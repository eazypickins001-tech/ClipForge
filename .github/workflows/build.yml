# Builds the ClipForge Windows installer.
#
# The native Windows pieces (the WGC capture helper and the Rust D3D11
# compositor addon) need MSVC + Windows SDK + CMake/Ninja + Rust + LLVM, which
# a local machine may not have. `windows-latest` ships MSVC, the SDK, CMake,
# Ninja and LLVM; Rust is added below. See docs/ENGINEERING_AUDIT.md (blockers
# B1-B4) for why this builds in CI rather than on the developer machine.
#
# Nothing is published: the installer is uploaded as a workflow artifact only.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (native + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-win-x64-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-win-x64-

      - name: Install dependencies
        run: npm ci

      # Vendors the pinned LGPL FFmpeg (shared libs + build-time SDK) and
      # refuses any non-LGPL build. Also required by the compositor addon.
      - name: Fetch pinned LGPL FFmpeg
        run: npm run fetch:ffmpeg

      - name: Fetch ONNX Runtime
        run: npm run fetch:onnxruntime

      - name: Build native capture helper (Windows Graphics Capture)
        run: npm run build:native:win

      - name: Stage MSVC OpenMP runtime
        run: npm run stage:vcomp

      - name: Build native D3D11 compositor addon
        run: npm run build:native:compositor

      # Until this step existed, NO workflow ran a Rust test: this job only ever BUILT the crate, so
      # all 609 `#[test]`s in it (regions, frame_geometry, audio, the timeline walk…) were executed
      # by nothing — they compiled, which is not the same claim. That is the Rust twin of a spec
      # that is never listed in the smoke step.
      #
      # Scoped to `regions::` on purpose. Those tests are pure math over a `SceneZoomRegion` with no
      # device, no media and no FFmpeg decode, so they survive on a GPU-less runner; they are also
      # the ones a zoom change touches (keyframed focus, the dip envelope, the strength curves).
      # Widening the filter is a separate decision, taken once the render tests are known to work
      # here — `crates/compositor/tests/` needs a real device.
      - name: Test the compositor's region math
        working-directory: crates
        run: cargo test -p compositor --lib regions::

      # OpenScreen's build-whisper-stt.yml did not survive the fork, so nothing has produced
      # this helper since — which is why every Windows install logs "whisper-stt-server
      # binary not found" and transcription is dead there. CPU-only on purpose; the reasons
      # (no glslc on the hosted images, and no hard vulkan-1.dll dependency) are written out
      # beside the WHISPER_STT_BACKEND override in scripts/build-whisper-stt.sh.
      - name: Build Whisper STT helper
        shell: bash
        env:
          WHISPER_STT_BACKEND: cpu
        run: bash scripts/build-whisper-stt.sh

      # A silent absence is exactly how this rotted: the helper is worthless unless it lands
      # where electron-builder's `win32-*/*` extraResources filter will pick it up.
      - name: Verify the Whisper STT helper was staged
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged=(electron/native/bin/win32-x64/whisper-stt-server*)
          if [ ${#staged[@]} -eq 0 ]; then
            echo "::error::whisper-stt-server was not staged under electron/native/bin/win32-x64/"
            exit 1
          fi
          ls -lh "${staged[@]}"

      - name: Type-check and build renderer
        run: npx tsc && npx vite build

      - name: Generate third-party licence texts (SBOM)
        run: npm run licenses:generate

      - name: Package NSIS installer
        run: npx electron-builder --win --config.npmRebuild=false --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-windows-x64
          # The whole win-unpacked tree is included, not just the .exe files: an
          # Electron build is not runnable without its DLLs, icudtl.dat, locale
          # paks and resources/app.asar, so an exe-only artifact cannot be smoke
          # tested. The NSIS installer is self-contained, but it is uploaded
          # alongside so the unpacked build can be launched directly.
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/latest.yml
            release/**/win-unpacked/**
            build-licenses/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

      # The native compositor addon only exists inside the packaged tree, so the export
      # path can be exercised NOWHERE else — a dev bundle answers "Native compositor
      # addon not present" and writes nothing. Before this step existed, these specs ran
      # nowhere at all and "export works" rested on a manual run somebody had to remember.
      #
      # WHAT RUNS HERE, and why the rest does not:
      #
      #  - GIF export, and import → trim → save → reopen. Both pass on a GPU-less runner.
      #
      #  - Clip edits (split, extract audio, the audio panel's mute) and boundary dips, via
      #    tests/e2e/clip-edits.spec.ts and tests/e2e/transitions.spec.ts. These prove the
      #    rendered UI writes the SAVED project — the junction button, the transition sheet and
      #    the undo-worthy write nothing else exercises. They need no GPU: the dip is on the
      #    document here, not on a composed frame (watching a dip means watching an export; see
      #    the handover's control matrix).
      #
      #  - MP4 export used to be excluded from this step. It failed at
      #    "enc hwdevice init: -1313558101 (Unknown error occurred)" because run_multi_inner
      #    tried to build a D3D11VA pool on a runner that has no video device, and only
      #    skipped that when the backend was already classified Cpu. Forcing the backend
      #    with OPENSCREEN_COMPOSITOR_BACKEND=cpu did NOT help — that switch is Linux-side.
      #    run_multi_inner now probes the pool and falls back to the system-memory path, so
      #    this step exercises the REAL user path: nothing below pins the backend or encoder.
      #
      #  - The GIF cancel/retry case is flaky while the CPU-bound encode starves the
      #    renderer, so it is excluded here too and stays runnable by hand.
      #
      #  - Transcription, via tests/e2e/transcription.spec.ts. This is the step that reaches
      #    the network: it downloads ggml-small-q8_0 (~264 MB) into the app's userData on
      #    first use, then runs CPU inference over a synthetic speech fixture. It asserts the
      #    words ("quick brown fox") and the segment timings land in the saved project, so it
      #    proves audio → whisper → document, which packaging alone never could.
      #
      # Keeping the excluded ones out means a red job here is always news.
      - name: Smoke-test the packaged app (export, trim/save/reopen, clip edits, transitions, transcription)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path release -Recurse -Filter ClipForge.exe | Select-Object -First 1).FullName
          # The MP4 spec decodes the exported file with the app's own bundled LGPL FFmpeg.
          $ffmpeg = (Get-ChildItem -Path release -Recurse -Filter ffmpeg-shared.exe | Select-Object -First 1).FullName
          $env:CLIPFORGE_APP_EXE = $exe
          $env:OPENSCREEN_TEST_FFMPEG = $ffmpeg
          # Transcription is only actually "shipped" if the helper is in the installer tree,
          # not merely staged in the repo before packaging.
          $whisper = Join-Path (Split-Path $exe) "resources\electron\native\bin\win32-x64\whisper-stt-server.exe"
          if (-not (Test-Path $whisper)) { throw "whisper-stt-server.exe is missing from the packaged app" }
          Write-Host "Whisper helper packaged: $whisper"
          Write-Host "Testing $exe"
          npx playwright test tests/e2e/gif-export.spec.ts tests/e2e/phase1-acceptance.spec.ts tests/e2e/clip-edits.spec.ts tests/e2e/transitions.spec.ts tests/e2e/transcription.spec.ts --grep-invert "cancels a running native GIF" --timeout 600000 --reporter list

      # Without this, a failure on the runner is a message with no state attached: the
      # first run's trim failure could not be explained from its log alone.
      - name: Upload e2e results when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-e2e-results
          path: test-results/**
          if-no-files-found: ignore
